schema_version: 1
domain: piste_b_math_v1
description: >
  Domaine piste B (demo jouable, cf. ADDENDUM_BANQUE_QUESTIONS.md) : extension
  a 7 concepts des 5 concepts piste A, en subdivisant arithmetic -> {arithmetic_base,
  fractions_ratios} et algebra -> {algebra_linear, algebra_advanced} (les deux
  buckets les plus larges/heterogenes, cf. PROMPT_A2_GRANULARITE.md). slip/guess
  NON calibres : valeurs expertes (guess = 1/nb_options, slip = 0.10), protocole
  B1. A ne pas confondre avec data/domain.yaml (piste A, calibre par EM sur les
  logs Junyi reels).

concepts:
  - id: arithmetic_base
    label: Arithmétique de base
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: fractions_ratios
    label: Fractions et ratios
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: algebra_linear
    label: Algèbre linéaire
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: algebra_advanced
    label: Algèbre avancée
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: geometry
    label: Géométrie
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: analytic_geometry
    label: Géométrie analytique
    slip: 0.10
    guess: 0.25
    calibrated: false
  - id: probability_statistics
    label: Probabilités et statistiques
    slip: 0.10
    guess: 0.25
    calibrated: false

prerequisites:
  - [arithmetic_base, fractions_ratios]
  - [arithmetic_base, geometry]
  - [algebra_linear, algebra_advanced]
  - [algebra_linear, analytic_geometry]

questions:
  # --- arithmetic_base ---
  - id: arithmetic_base_1
    concept: arithmetic_base
    difficulty: 1
    stem: "Combien font 7 × 8 ?"
    options: ["54", "56", "64", "72"]
    answer: 1
  - id: arithmetic_base_2
    concept: arithmetic_base
    difficulty: 1
    stem: "15 % de 200, ça fait combien ?"
    options: ["15", "20", "30", "40"]
    answer: 2
  - id: arithmetic_base_3
    concept: arithmetic_base
    difficulty: 2
    stem: "Combien font 4 + 2 × 3 ?"
    options: ["10", "18", "9", "24"]
    answer: 0
  - id: arithmetic_base_4
    concept: arithmetic_base
    difficulty: 2
    stem: "Que vaut −8 + 3 ?"
    options: ["−11", "−5", "5", "11"]
